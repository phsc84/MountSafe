# Configuration for go tool staticcheck (https://staticcheck.dev/docs/checks).
#
# Enabled: all checks, including those staticcheck leaves off by default.
#
# Disabled:
# - ST1005 (error string style): error texts are user-facing sentences on
#   purpose, capitalised and with punctuation, as in RestoreSafe.
#
# Exempted per file: Windows API names (ST1003) where they match the Windows
# SDK headers; each such file carries a //lint:file-ignore ST1003 with its
# reason.
#
# Disabling another check changes the project's rules: add it under
# "Disabled" with its reason (docs/GUIDE-ci.md).
checks = ["all", "-ST1005"]
